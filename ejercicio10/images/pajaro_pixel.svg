<svg xmlns="http://www.w3.org/2000/svg" width="140" height="80" viewBox="0 0 14 8" shape-rendering="crispEdges">
  <!-- Improved Pixel Pterodactyl 14x8: clearer wings, beak and body -->
  <!-- outline -->
  <rect x="0" y="3" width="1" height="1" fill="#000"/>
  <rect x="1" y="2" width="1" height="1" fill="#000"/>
  <rect x="2" y="2" width="1" height="1" fill="#000"/>
  <rect x="3" y="2" width="1" height="1" fill="#000"/>
  <rect x="4" y="2" width="1" height="1" fill="#000"/>
  <rect x="5" y="2" width="1" height="1" fill="#000"/>
  <rect x="6" y="2" width="1" height="1" fill="#000"/>
  <rect x="9" y="2" width="1" height="1" fill="#000"/>
  <rect x="11" y="2" width="1" height="1" fill="#000"/>

  <!-- body and wings -->
  <rect x="1" y="3" width="2" height="1" fill="#4FC3F7"/>
  <rect x="3" y="2" width="4" height="1" fill="#4FC3F7"/>
  <rect x="7" y="2" width="2" height="1" fill="#4FC3F7"/>
  <rect x="9" y="3" width="3" height="1" fill="#4FC3F7"/>
  <rect x="5" y="4" width="2" height="1" fill="#4FC3F7"/>

  <!-- beak and eye -->
  <rect x="10" y="3" width="1" height="1" fill="#000"/>
  <rect x="11" y="3" width="1" height="1" fill="#ffd27f"/>
  <rect x="8" y="3" width="1" height="1" fill="#ffffff"/>

  <!-- subtle wing curvature -->
  <rect x="2" y="4" width="1" height="1" fill="#4FC3F7" opacity="0.95"/>
  <rect x="6" y="3" width="1" height="1" fill="#4FC3F7"/>
</svg>
