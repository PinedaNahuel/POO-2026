<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 16 12" shape-rendering="crispEdges">
  <!-- Improved Pixel T-Rex 16x12: clearer head, teeth, tail and legs -->
  <!-- outline -->
  <rect x="0" y="2" width="1" height="1" fill="#000"/>
  <rect x="1" y="1" width="1" height="1" fill="#000"/>
  <rect x="2" y="1" width="1" height="1" fill="#000"/>
  <rect x="3" y="1" width="1" height="1" fill="#000"/>
  <rect x="4" y="1" width="1" height="1" fill="#000"/>
  <rect x="6" y="1" width="1" height="1" fill="#000"/>
  <rect x="7" y="1" width="1" height="1" fill="#000"/>
  <rect x="9" y="1" width="1" height="1" fill="#000"/>
  <rect x="11" y="2" width="1" height="1" fill="#000"/>
  <rect x="13" y="3" width="1" height="1" fill="#000"/>

  <!-- body colors -->
  <rect x="1" y="2" width="1" height="1" fill="#2e7d32"/>
  <rect x="2" y="2" width="1" height="1" fill="#57a05d"/>
  <rect x="3" y="2" width="1" height="1" fill="#2e7d32"/>
  <rect x="4" y="2" width="1" height="1" fill="#2e7d32"/>
  <rect x="5" y="2" width="1" height="1" fill="#2e7d32"/>
  <rect x="6" y="2" width="1" height="1" fill="#2e7d32"/>
  <rect x="7" y="2" width="1" height="1" fill="#2e7d32"/>
  <rect x="8" y="2" width="1" height="1" fill="#2e7d32"/>
  <rect x="9" y="2" width="1" height="1" fill="#3f8f3a"/>
  <rect x="10" y="2" width="1" height="1" fill="#3f8f3a"/>

  <rect x="1" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="2" y="3" width="1" height="1" fill="#57a05d"/>
  <rect x="3" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="4" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="5" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="6" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="7" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="8" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="9" y="3" width="1" height="1" fill="#2e7d32"/>

  <rect x="2" y="4" width="1" height="1" fill="#2e7d32"/>
  <rect x="3" y="4" width="1" height="1" fill="#2e7d32"/>
  <rect x="4" y="4" width="1" height="1" fill="#a8d08d"/>
  <rect x="5" y="4" width="1" height="1" fill="#2e7d32"/>
  <rect x="6" y="4" width="1" height="1" fill="#2e7d32"/>
  <rect x="7" y="4" width="2" height="1" fill="#2e7d32"/>
  <rect x="9" y="4" width="1" height="1" fill="#2e7d32"/>

  <!-- legs -->
  <rect x="4" y="5" width="1" height="1" fill="#000"/>
  <rect x="6" y="5" width="1" height="1" fill="#000"/>
  <rect x="5" y="6" width="1" height="1" fill="#000"/>

  <!-- tail -->
  <rect x="12" y="3" width="1" height="1" fill="#2e7d32"/>
  <rect x="13" y="4" width="1" height="1" fill="#2e7d32"/>

  <!-- eye and teeth -->
  <rect x="8" y="2" width="1" height="1" fill="#000"/>
  <rect x="9" y="2" width="1" height="1" fill="#fff"/>
  <rect x="7" y="2" width="1" height="1" fill="#000"/>
  <rect x="5" y="3" width="1" height="1" fill="#ffffff"/>
  <rect x="6" y="3" width="1" height="1" fill="#ffffff"/>
</svg>
