<svg xmlns="http://www.w3.org/2000/svg" width="80" height="120" viewBox="0 0 8 12" shape-rendering="crispEdges">
  <!-- Pixel cactus 8x12 with outline and spikes -->
  <!-- outline -->
  <rect x="2" y="0" width="4" height="1" fill="#000"/>
  <rect x="1" y="1" width="6" height="1" fill="#000"/>
  <rect x="1" y="2" width="1" height="6" fill="#000"/>
  <rect x="6" y="2" width="1" height="6" fill="#000"/>
  <rect x="2" y="8" width="4" height="1" fill="#000"/>

  <rect x="3" y="1" width="2" height="8" fill="#2E8B57"/>
  <rect x="1" y="3" width="2" height="4" fill="#2E8B57"/>
  <rect x="5" y="3" width="2" height="4" fill="#2E8B57"/>
  <!-- small white spikes -->
  <rect x="3" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="4" y="4" width="1" height="1" fill="#ffffff"/>
  <rect x="2" y="6" width="1" height="1" fill="#ffffff"/>
</svg>
